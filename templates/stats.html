<!DOCTYPE html>
<html>
    <style>
        /* Container for the chart area */
        .chart-area {
            display: flex;
            align-items: center;
            flex-direction: column;
        }

        /* Wrapper to position the Y-axis label and values */
        .chart-wrapper {
            display: flex;
            align-items: center;
            position: relative;
        }

        /* Y-axis label */
        .y-axis-label {
            font-weight: bold;
            margin-right: 10px; /* Space between Y-axis label and axis */
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            margin-right: 45px;
        }

        /* Chart container with bars */
        .chart-container {
            display: flex;
            align-items: flex-end;
            height: 300px;
            width: 100%;
            border-left: 2px solid #333;
            border-bottom: 2px solid #333;
            padding: 10px;
            position: relative;
        }

        /* Y-axis values */
        .y-axis-values {
            position: absolute;
            left: -40px;
            top: 0;
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: space-between;
            font-weight: bold;
        }

        /* Individual bar */
        .bar {
            width: 50px;
            margin: 0 10px;
            background-color: #3498db;
            text-align: center;
            color: white;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        /* Label for each bar's X value */
        .x-value {
            margin-top: 5px;
            margin-left: 5px;
        }

        /* X-axis label */
        .x-axis-label {
            font-weight: bold;
            margin-top: 15px;
        }
    </style>    
    <head>
        <br><br><br><br><br>
        <script style="height: 50%;">
            window.onload = function () {
            var dps = [];
            var chart = new CanvasJS.Chart("chartContainer", {
                title: {
                    text: "Current Salary Posting",
                },
                data: [
                    {
                        type: "line",
                        dataPoints: dps,
                    },
                ],
            });
            var xVal = 0;
            const companies = ["Saab", "Volvo", "BMW"]
            var yVal = 100;
            var updateInterval = 1000;
            var dataLength = 20;

            var updateChart = function (count) {
                count = count || 1;
                for (var j = 0; j < count; j++) {
                    yVal = yVal + Math.round(5 + Math.random() * (-5 - 5));
                    dps.push({
                        x: xVal,
                        y: yVal
                    });
                    xVal++;
                }
                if (dps.length > dataLength) {
                    dps.shift();
                }
                chart.render();
            };

            updateChart(dataLength);
            setInterval(function () {
                updateChart();
            }, updateInterval);
        }
            
        </script>
        
    </head>
    
    <body>
      
    <div id="chartContainer" style="height: 300px; width: 100%"></div>
    <script src="https://canvasjs.com/assets/script/canvasjs.min.js"></script>
    <h3 style="max-width: fit-content; margin-left: auto; margin-right: auto;">Market today</h3>     
    <h2 style="text-align: center;">Salaries for Software Development Role</h2>

    <div class="chart-area">
        <div class="chart-wrapper">
            <!-- Y-axis label -->
            <div class="y-axis-label">Salaries</div>
    
            <!-- Chart Container -->
            <div class="chart-container">
                <!-- Y-axis values -->
                <div class="y-axis-values">
                    <div>100k</div>
                    <div>80k</div>
                    <div>60k</div>
                    <div>40k</div>
                    <div>20k</div>
                    <div>0k</div>
                </div>
                <!-- Bars -->
                <div class="bar" style="height: 220px;">77</div>
                <div class="bar" style="height: 235px;">80</div>
                <div class="bar" style="height: 200px;">68</div>
                <div class="bar" style="height: 280px;">92</div>
                <div class="bar" style="height: 260px;">90</div>
            </div>
        </div>
    
        <!-- X values below each bar -->
        <div style="display: flex; justify-content: space-around; width: 22%; margin-left: 60px;">
            <div class="x-value">Leidos</div>
            <div class="x-value">CDS Vis</div>
            <div class="x-value">TMiz</div>
            <div class="x-value">NewEIC</div>
            <div class="x-value">Bronxil</div>
        </div>
    
        <!-- X-axis label -->
        <div class="x-axis-label">Companies</div>
    </div>


    
      
    </body>
</html>
